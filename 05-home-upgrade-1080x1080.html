<style>
  .head5 { position: absolute; left: 64px; right: 64px; top: 56px; }
  .grid  { position: absolute; left: 64px; right: 64px; top: 286px;
           display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

  .tile {
    position: relative; height: 296px; overflow: hidden;
    background: linear-gradient(158deg, rgba(243,248,238,.075), rgba(243,248,238,.018));
    border: 1.5px solid var(--hairline);
  }
  /* house-angle accent in each tile's top-right */
  .tile::before {
    content: ''; position: absolute; inset: 0;
    background: var(--ramp); opacity: .16;
    clip-path: polygon(100% 0, 100% 118px, 100% 0, calc(100% - 92px) 0);
  }
  .tile .art { position: absolute; left: 22px; top: 20px; bottom: 66px; width: 210px;
               display: grid; place-items: center; }
  .tile .art svg { max-width: 100%; max-height: 100%;
                   filter: drop-shadow(0 18px 26px rgba(0,0,0,.5)); }
  .tile .meta { position: absolute; right: 26px; top: 34px; width: 190px; text-align: right; }
  .tile .cat  { font-size: 13px; font-weight: 700; letter-spacing: .22em;
                text-transform: uppercase; color: var(--lime-hi); }
  .tile .name { font-size: 30px; font-weight: 800; letter-spacing: -.02em;
                line-height: 1.08; margin-top: 12px; text-transform: uppercase; }
  .tile .from { position: absolute; right: 26px; bottom: 24px; text-align: right; }
  .tile .from small { display: block; font-size: 12px; font-weight: 600;
                letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .tile .from b { font-size: 34px; font-weight: 900; letter-spacing: -.03em; color: var(--paper); }

  .foot5 { position: absolute; left: 64px; right: 64px; bottom: 54px;
           display: flex; align-items: center; justify-content: space-between; }
</style>
