<!-- =========================================================================
     13 — Square 1080×1080. Two-product bundle. The plus sign between the
     stages is doing the whole job of explaining the offer, so it is drawn
     as furniture rather than set as type.
     ========================================================================= -->
<div class="b s-sq">

  <div class="field-teal"></div>
  <div class="dots" style="left:0;top:0;width:250px;height:200px;color:#8FD00E;opacity:.2"></div>
  <div class="dots" style="right:0;bottom:0;width:250px;height:200px;color:#8FD00E;opacity:.2"></div>
  <div class="glow" style="left:50%;top:300px;width:760px;height:420px;transform:translateX(-50%);opacity:.7"></div>

  <div class="lg" data-logo="light" style="--h:60px;position:absolute;left:50%;top:60px;transform:translateX(-50%)"></div>

  <div class="abs" style="left:0;right:0;top:172px;text-align:center">
    <div class="eyebrow on-dark">Kitchen Combo</div>
    <div class="d white" style="margin-top:16px;font-size:70px;line-height:.96">COOK &amp; BLEND</div>
    <div class="d lime-hi" style="margin-top:2px;font-size:70px;line-height:.96">SAVE MORE</div>
  </div>

  <!-- the two products, sharing one floor line -->
  <div class="stage" style="left:112px;top:414px;width:300px;height:330px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="plus abs" style="left:50%;top:552px;transform:translate(-50%,-50%)">+</div>
  <div class="stage" style="right:112px;top:472px;width:300px;height:272px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>

  <hr class="hair on-dark abs" style="left:112px;right:112px;top:786px">

  <div class="row abs" style="left:0;right:0;top:812px;justify-content:center;gap:26px;align-items:baseline">
    <span class="price-was" style="font-size:30px">৳6,700</span>
    <span class="price-now" style="font-size:74px">৳4,690</span>
    <div class="flag"><span>Save ৳2,010</span></div>
  </div>

  <div class="trust abs mid" style="top:918px;gap:34px">
    <div class="t on-dark"><span class="ico-slot" data-i="check"></span><div><b>100% Original</b></div></div>
    <div class="t on-dark"><span class="ico-slot" data-i="shield"></span><div><b>1 Year Warranty</b></div></div>
    <div class="t on-dark"><span class="ico-slot" data-i="truck"></span><div><b>Free Delivery</b></div></div>
  </div>

  <div class="cta abs" style="left:50%;bottom:34px;transform:translateX(-50%);font-size:19px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Order The Combo <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<style>
  .plus { z-index: 6; width: 74px; height: 74px; border-radius: 50%;
          display: grid; place-items: center;
          background: var(--ramp-lime); color: #fff;
          font-size: 44px; font-weight: 800; line-height: 1;
          box-shadow: 0 16px 30px -12px rgba(0,0,0,.55); }
</style>
