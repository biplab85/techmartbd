<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>08 · Cash On Delivery · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     08 — Feed post 1200×630. Pay-on-arrival message. Kept pale and calm:
     this one exists to remove hesitation, not to raise volume.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-pale"></div>
  <div class="pan pan-lime" style="left:0;width:112px;clip-path:polygon(0 0,100% 0,calc(100% - 62px) 100%,0 100%)"></div>
  <div class="pan pan-teal" style="left:0;width:90px;clip-path:polygon(0 0,100% 0,calc(100% - 62px) 100%,0 100%)"></div>

  <div class="glow" style="right:70px;bottom:52px;width:430px;height:380px;opacity:.5"></div>

  <div class="lg" data-logo="dark" style="--h:60px;position:absolute;left:150px;top:52px"></div>

  <div class="abs" style="left:150px;top:180px;width:520px">
    <div class="eyebrow">Order Without Worry</div>
    <div class="d" style="margin-top:16px;font-size:60px;line-height:.98">CASH ON</div>
    <div class="d lime" style="margin-top:2px;font-size:60px;line-height:.98">DELIVERY</div>
    <div class="lede" style="margin-top:20px;font-size:18px;max-width:430px">
      Check the product first, pay the courier after.
      Available on every order, everywhere in Bangladesh.
    </div>
  </div>

  <div class="trust abs" style="left:150px;bottom:60px;gap:0">
    <div class="t stack" style="padding-right:28px"><span class="ico-slot" data-i="cash"></span>
      <div><b>Pay After</b><span>You Check</span></div></div>
    <div class="t stack" style="padding:0 28px"><span class="ico-slot" data-i="ret"></span>
      <div><b>7 Day</b><span>Return</span></div></div>
    <div class="t stack" style="padding-left:28px"><span class="ico-slot" data-i="check"></span>
      <div><b>No Advance</b><span>Payment</span></div></div>
  </div>

  <!-- product cluster on the pale side -->
  <div class="stage" style="right:330px;bottom:162px;width:186px;height:264px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="right:212px;bottom:172px;width:158px;height:184px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>
  <div class="stage" style="right:126px;bottom:180px;width:110px;height:170px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>

  <div class="cta abs" style="right:126px;bottom:52px;font-size:19px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Order Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
