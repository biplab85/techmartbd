<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>12 · Blender Spotlight · 1080×1080</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     12 — Square 1080×1080. Same single-product template as 11, inverted:
     pale stage, teal selling block, so the two do not look like one post
     twice when they land in the same feed.
     ========================================================================= -->
<div class="b s-sq">

  <div class="field-pale"></div>

  <!-- teal selling block along the foot, angled hem on top -->
  <div class="abs" style="left:0;right:0;bottom:0;height:452px;background:var(--ramp-lime);z-index:1;
       clip-path:polygon(0 76px,100% 0,100% 100%,0 100%)"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:430px;background:var(--ramp-teal);z-index:1;
       clip-path:polygon(0 76px,100% 0,100% 100%,0 100%)"></div>

  <div class="glow" style="left:50%;top:180px;width:560px;height:480px;transform:translateX(-50%);opacity:.5"></div>

  <div class="lg" data-logo="dark" style="--h:60px;position:absolute;left:64px;top:56px"></div>

  <div class="seal abs" style="right:56px;top:120px;width:186px;height:186px">
    <div>
      <div class="up">Up To</div>
      <div class="pct" style="font-size:62px">30%</div>
      <div class="lbl" style="font-size:22px">OFF</div>
    </div>
  </div>

  <div class="stage" style="left:50%;top:180px;width:420px;height:470px;transform:translateX(-50%)">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>

  <!-- ---------- selling block ----------
       Anchored from the top, not the bottom: measured from the foot, the
       first line of this stack lands on the lime seam at y≈700, which puts
       lime type on a lime plate and the eyebrow disappears. -->
  <div class="abs" style="left:0;right:0;top:742px;text-align:center">
    <div class="eyebrow on-dark">2 Litre Juicer Blender</div>
    <div class="d white" style="margin-top:16px;font-size:62px;line-height:.96">FRESH JUICE</div>
    <div class="d lime-hi" style="margin-top:2px;font-size:62px;line-height:.96">IN SECONDS</div>
  </div>

  <div class="row abs mid" style="top:924px;gap:12px">
    <div class="chip on-dark"><i class="dot"></i>450W Motor</div>
    <div class="chip on-dark"><i class="dot"></i>Stainless Blade</div>
    <div class="chip on-dark"><i class="dot"></i>1 Year Warranty</div>
  </div>

  <div class="row abs" style="left:64px;bottom:44px;gap:16px;align-items:baseline">
    <span class="price-was" style="font-size:26px">৳3,200</span>
    <span class="price-now" style="font-size:56px">৳2,240</span>
  </div>

  <div class="cta cta-w abs" style="right:64px;bottom:48px;font-size:19px">
    Order Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
