<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>03 · Your Trusted Gadget Partner · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     03 — Feed post 1200×630. Reference row 4: pale product field, teal
     closing panel on the right carrying the promise and the CTA.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-pale"></div>
  <div class="glow" style="left:340px;bottom:40px;width:520px;height:420px;opacity:.55"></div>

  <!-- closing panel, lime seam behind it -->
  <div class="pan pan-lime" style="left:718px;right:0;clip-path:polygon(96px 0,100% 0,100% 100%,0 100%)"></div>
  <div class="pan pan-teal" style="left:740px;right:0;clip-path:polygon(96px 0,100% 0,100% 100%,0 100%)"></div>

  <!-- ---------- copy column ---------- -->
  <div class="lg" data-logo="dark" style="--h:60px;position:absolute;left:56px;top:50px"></div>

  <div class="abs" style="left:56px;top:172px;width:420px">
    <div class="d d4">YOUR TRUSTED</div>
    <div class="d d4 lime" style="margin-top:4px">GADGET PARTNER</div>
  </div>

  <div class="trust abs" style="left:56px;bottom:56px;gap:0">
    <div class="t stack" style="padding-right:26px"><span class="ico-slot" data-i="check"></span>
      <div><b>100%</b><span>Original</span></div></div>
    <div class="t stack" style="padding:0 26px"><span class="ico-slot" data-i="medal"></span>
      <div><b>Best</b><span>Quality</span></div></div>
    <div class="t stack" style="padding:0 26px"><span class="ico-slot" data-i="shield"></span>
      <div><b>1 Year</b><span>Warranty</span></div></div>
    <div class="t stack" style="padding-left:26px"><span class="ico-slot" data-i="truck"></span>
      <div><b>Fast</b><span>Delivery</span></div></div>
  </div>

  <!-- ---------- product field ---------- -->
  <div class="stage" style="left:400px;bottom:196px;width:120px;height:186px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>
  <div class="stage" style="left:494px;bottom:174px;width:200px;height:284px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="left:624px;bottom:180px;width:150px;height:176px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>

  <!-- ---------- promise panel ---------- -->
  <div class="abs" style="right:56px;top:104px;width:304px;text-align:right">
    <div class="d d5 white">Best Quality</div>
    <div class="d d5 white" style="margin-top:6px">Best Price</div>
    <div class="script" style="margin-top:12px;font-size:44px">Every Time</div>
  </div>

  <div class="cta cta-w abs" style="right:56px;top:330px;font-size:18px">
    Order Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="row abs" style="right:56px;top:412px;gap:10px">
    <span class="ico-slot" data-i="pin" style="display:block;width:20px;height:20px"></span>
    <span class="url">www.techcartbd.com</span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<style>
  /* the pin icon in the url line inherits .t .ico sizing nowhere, so set it here */
  .row .ico-slot .ico { width: 20px; height: 20px; stroke: #8FD00E; stroke-width: 2;
    fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>

<script src="assets.js"></script>
</body>
</html>
