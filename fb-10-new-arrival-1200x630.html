<!doctype html>
<html lang="en">
<head>

<!-- =========================================================================
     10 — Feed post 1200×630. Product-first launch layout: the item is the
     hero, the copy sits beside it, the price does the closing.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-pale"></div>

  <!-- teal stage the product stands against -->
  <div class="pan pan-lime" style="left:0;width:562px;clip-path:polygon(0 0,100% 0,calc(100% - 104px) 100%,0 100%)"></div>
  <div class="pan pan-teal" style="left:0;width:540px;clip-path:polygon(0 0,100% 0,calc(100% - 104px) 100%,0 100%)"></div>

  <div class="glow" style="left:120px;top:110px;width:400px;height:400px;opacity:.85"></div>
  <div class="dots" style="left:0;bottom:0;width:220px;height:170px;color:#8FD00E;opacity:.2"></div>

  <div class="stage" style="left:96px;top:88px;width:300px;height:450px">
    <div class="pslot" data-p="watch"></div>
  </div>

  <div class="flag abs" style="left:404px;top:100px"><span>New</span></div>

  <!-- ---------- copy ---------- -->
  <div class="lg" data-logo="dark" style="--h:56px;position:absolute;right:58px;top:52px"></div>

  <div class="abs" style="right:58px;top:172px;width:520px;text-align:right">
    <div class="eyebrow">Just Landed</div>
    <div class="d" style="margin-top:14px;font-size:54px;line-height:.98">SMART WATCH</div>
    <div class="d lime" style="margin-top:2px;font-size:54px;line-height:.98">SERIES 9</div>
    <div class="lede" style="margin-top:18px;font-size:17px">
      Always-on display, heart-rate and SpO₂ tracking,<br>
      7-day battery and full call support.
    </div>
  </div>

  <div class="row abs" style="right:58px;top:392px;gap:12px;justify-content:flex-end">
    <div class="chip"><i class="dot"></i>Bluetooth Call</div>
    <div class="chip"><i class="dot"></i>IP68</div>
    <div class="chip"><i class="dot"></i>7 Day Battery</div>
  </div>

  <div class="row abs" style="right:58px;bottom:58px;gap:34px;align-items:center">
    <div class="price" style="align-items:baseline">
      <span class="price-was" style="color:#9AAAAF">৳3,500</span>
      <span class="price-now" style="color:var(--lime-lo);font-size:54px">৳2,450</span>
    </div>
    <div class="cta" style="font-size:18px">
      Order Now <span class="knob"><i class="chev"></i></span>
    </div>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
