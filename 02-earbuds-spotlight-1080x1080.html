<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TECHCARTBD — Earbuds Spotlight 1080x1080</title>
<link rel="stylesheet" href="brand.css">
<style>
  .top    { position: absolute; left: 68px; right: 68px; top: 60px;
            display: flex; align-items: center; justify-content: space-between; }
  .stage-2{ left: 50%; transform: translateX(-50%); top: 198px; width: 720px; height: 400px; z-index: 3; }
  .ped-2  { left: 318px; top: 556px; width: 440px; height: 112px; }
  .body   { position: absolute; left: 68px; right: 68px; top: 638px; text-align: center; }
  .specs  { display: flex; gap: 14px; justify-content: center; margin-top: 26px; }
  .buy    { display: flex; align-items: center; justify-content: center; gap: 34px; margin-top: 34px; }
  /* top-right corner wedge on the house angle */
  .corner { position: absolute; inset: 0; z-index: 1; background: var(--ramp); opacity: .18;
            clip-path: polygon(1080px 0px, 1080px 430px, 745px 0px); }
</style>
</head>
<body>

<div class="banner s-square">
  <div class="atmos"></div>
  <div class="corner"></div>

  <div class="top">
    <svg class="logo" viewBox="0 0 236 72" role="img" aria-label="TechCartBD" style="height:54px">
      <defs>
        <linearGradient id="Lbar" gradientUnits="userSpaceOnUse" x1="11" y1="21" x2="46.9" y2="15">
          <stop offset="0" stop-color="#17924E"/><stop offset=".5" stop-color="#5FA028"/><stop offset="1" stop-color="#86BD08"/></linearGradient>
        <linearGradient id="Lstem" gradientUnits="userSpaceOnUse" x1="26.5" y1="24" x2="26.5" y2="58.8">
          <stop offset="0" stop-color="#0A9364"/><stop offset="1" stop-color="#047285"/></linearGradient>
        <linearGradient id="Larm" gradientUnits="userSpaceOnUse" x1="56" y1="13.4" x2="56" y2="24">
          <stop offset="0" stop-color="#12A165"/><stop offset="1" stop-color="#0E9159"/></linearGradient>
        <linearGradient id="Lhook" gradientUnits="userSpaceOnUse" x1="38" y1="25.2" x2="70.8" y2="58.8">
          <stop offset="0" stop-color="#8CC80B"/><stop offset=".37" stop-color="#329B49"/><stop offset="1" stop-color="#027183"/></linearGradient>
      </defs>
      <path fill="url(#Lbar)"  d="M11 13.4H46.86L38.61 24H11Z"/>
      <path fill="url(#Lstem)" d="M21 24h11v34.8H21z"/>
      <path fill="url(#Larm)"  d="M49.86 13.4H71.86L63.61 24H41.61Z"/>
      <path fill="url(#Lhook)" d="M38 25.2H48.5V44.7A3.6 3.6 0 0 0 52.1 48.3H70.8L63.8 58.8H52.1A14.1 14.1 0 0 1 38 44.7Z"/>
      <text x="84" y="39.5" font-size="21.4" font-weight="700" letter-spacing="-.3" textLength="129.5" lengthAdjust="spacing">
        <tspan fill="#F3F8EE">TECH</tspan><tspan fill="#8FD00E">CART</tspan><tspan fill="#F3F8EE">BD</tspan></text>
      <text x="85" y="57.5" font-size="11.4" font-weight="500" letter-spacing=".15" fill="#8FA8A3" textLength="83.5" lengthAdjust="spacing">techcartbd.com</text>
    </svg>
    <span class="chip"><i class="dot"></i>New Arrival</span>
  </div>

  <!-- ===================== PRODUCT ===================== -->
  <div class="stage stage-2">
    <div class="halo"></div>
    <div class="product-slot is-placeholder">
      <!-- SWAP -> <img src="photos/earbuds.png" alt="Wireless earbuds"> -->
      <svg viewBox="0 0 640 360" width="660" aria-label="Wireless earbuds and charging case">
        <defs>
          <linearGradient id="e-shell" x1=".15" y1="0" x2=".8" y2="1">
            <stop offset="0" stop-color="#FCFDFB"/><stop offset=".42" stop-color="#DCE5E0"/>
            <stop offset=".78" stop-color="#AEBEBA"/><stop offset="1" stop-color="#7C8D8A"/>
          </linearGradient>
          <linearGradient id="e-case" x1=".1" y1="0" x2=".85" y2="1">
            <stop offset="0" stop-color="#F1F6F2"/><stop offset=".45" stop-color="#C6D2CE"/>
            <stop offset="1" stop-color="#6E7F7C"/>
          </linearGradient>
        </defs>

        <!-- charging case, lid closed -->
        <g transform="translate(388 74)">
          <rect x="0" y="0" width="234" height="212" rx="52" fill="url(#e-case)"/>
          <path d="M0 66h234" stroke="rgba(0,0,0,.20)" stroke-width="3.5"/>
          <path d="M0 62h234" stroke="rgba(255,255,255,.45)" stroke-width="2.5"/>
          <circle cx="117" cy="168" r="7"  fill="#8FD00E"/>
          <circle cx="117" cy="168" r="17" fill="#8FD00E" opacity=".2"/>
          <path d="M22 62c0-24 20-44 44-44h26c-38 22-60 56-66 104-3-16-4-38-4-60z" fill="rgba(255,255,255,.34)"/>
          <rect x="88" y="200" width="58" height="7" rx="3.5" fill="rgba(0,0,0,.18)"/>
        </g>

        <!-- left bud -->
        <g transform="translate(122 118) rotate(-14)">
          <rect x="-15" y="14" width="30" height="132" rx="15" fill="url(#e-shell)"/>
          <rect x="-15" y="108" width="30" height="38" rx="15" fill="#2A4442"/>
          <ellipse cx="0" cy="0" rx="47" ry="40" fill="url(#e-shell)"/>
          <ellipse cx="8" cy="-33" rx="21" ry="14" fill="#243C3B"/>
          <ellipse cx="8" cy="-36" rx="12" ry="8"  fill="#16292A"/>
          <rect x="-30" y="-9" width="24" height="8" rx="4" fill="#1B302F"/>
          <ellipse cx="19" cy="-6" rx="12" ry="16" fill="rgba(255,255,255,.52)"/>
        </g>

        <!-- right bud -->
        <g transform="translate(256 176) rotate(10)">
          <rect x="-15" y="14" width="30" height="132" rx="15" fill="url(#e-shell)"/>
          <rect x="-15" y="108" width="30" height="38" rx="15" fill="#2A4442"/>
          <ellipse cx="0" cy="0" rx="47" ry="40" fill="url(#e-shell)"/>
          <ellipse cx="-8" cy="-33" rx="21" ry="14" fill="#243C3B"/>
          <ellipse cx="-8" cy="-36" rx="12" ry="8"  fill="#16292A"/>
          <rect x="6" y="-9" width="24" height="8" rx="4" fill="#1B302F"/>
          <ellipse cx="-19" cy="-6" rx="12" ry="16" fill="rgba(255,255,255,.52)"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- ===================== COPY ===================== -->
  <div class="body">
    <div class="eyebrow">True Wireless &middot; Stereo</div>
    <h1 class="display d-2" style="margin-top:20px">Pro Buds <span class="on-grad">40H</span></h1>

    <div class="specs">
      <span class="chip">40H Total Playtime</span>
      <span class="chip">ENC Call Noise Cut</span>
      <span class="chip">Bluetooth 5.3</span>
    </div>

    <div class="buy">
      <div class="price">
        <span class="price-now"><span class="tk">&#2547;</span>1,890</span>
        <span class="price-was"><span class="tk">&#2547;</span>2,990</span>
      </div>
      <span class="cta">Order Now <i class="chev"></i></span>
    </div>

    <div class="micro" style="margin-top:30px">Cash on delivery &middot; 7-day replacement &middot; Nationwide</div>
  </div>

  <div class="vignette"></div>
  <div class="grain"></div>
</div>

</body>
</html>
