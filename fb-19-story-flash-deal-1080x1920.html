<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>19 · Story · Flash Deal · 1080×1920</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     19 — Story / Reel 1080×1920.
     Facebook overlays its own chrome top and bottom, so nothing that matters
     sits above y=250 or below y=1670.
     ========================================================================= -->
<div class="b s-story">

  <div class="field-teal"></div>
  <div class="dots" style="left:0;top:180px;width:300px;height:240px;color:#8FD00E;opacity:.2"></div>
  <div class="dots" style="right:0;bottom:220px;width:300px;height:240px;color:#8FD00E;opacity:.2"></div>
  <div class="glow" style="left:50%;top:720px;width:820px;height:640px;transform:translateX(-50%);opacity:.8"></div>

  <!-- lime blades top and bottom -->
  <div class="abs" style="left:-60px;right:-60px;top:664px;height:26px;background:var(--ramp-lime);
       z-index:1;clip-path:polygon(0 0,100% 16px,100% 100%,0 calc(100% - 16px))"></div>

  <div class="lg" data-logo="light" style="--h:74px;position:absolute;left:50%;top:266px;transform:translateX(-50%)"></div>

  <div class="abs" style="left:0;right:0;top:396px;text-align:center">
    <div class="eyebrow on-dark" style="font-size:18px">24 Hours Only</div>
    <div class="d white" style="margin-top:22px;font-size:104px;line-height:.94">FLASH</div>
    <div class="d lime-hi" style="margin-top:4px;font-size:104px;line-height:.94">SALE</div>
  </div>

  <!-- product stack -->
  <div class="stage" style="left:50%;top:700px;width:500px;height:540px;transform:translateX(-50%)">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="left:112px;top:920px;width:190px;height:290px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>
  <div class="stage" style="right:96px;top:960px;width:240px;height:270px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>

  <div class="off abs white" style="left:0;right:0;top:1298px">
    <div class="up" style="font-size:26px">Up To</div>
    <div class="pct lime-hi" style="font-size:128px;letter-spacing:-.05em">30%</div>
    <div class="lbl" style="font-size:42px">OFF</div>
  </div>

  <!-- Everything below here stays above y=1670: Facebook's story chrome eats
       the bottom 250px, and a CTA the viewer cannot see is a wasted CTA. -->
  <div class="row abs mid" style="top:1524px;gap:16px">
    <div class="chip on-dark"><i class="dot"></i>Free Delivery</div>
    <div class="chip on-dark"><i class="dot"></i>Cash On Delivery</div>
  </div>

  <div class="cta abs" style="left:50%;top:1596px;transform:translateX(-50%);font-size:24px;padding:20px 20px 20px 38px">
    <svg class="cart" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Grab The Deal <span class="knob" style="width:42px;height:42px"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
