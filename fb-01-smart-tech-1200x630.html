<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 · Smart Tech Better Life · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     01 — Feed post 1200×630. The flagship layout from the reference strip:
     white copy field on the left, teal product field on the right, the two
     separated by a lime seam leaning on the house angle.
     ========================================================================= -->
<div class="b s-feed">

  <!-- lime seam sits behind the teal panel and shows as a band along the cut -->
  <div class="pan pan-lime" style="left:494px;right:0;clip-path:polygon(120px 0,100% 0,100% 100%,0 100%)"></div>
  <div class="pan pan-teal" style="left:518px;right:0;clip-path:polygon(120px 0,100% 0,100% 100%,0 100%)"></div>

  <div class="dots" style="right:0;top:0;width:230px;height:180px;color:#8FD00E;opacity:.22"></div>
  <div class="glow" style="left:560px;bottom:20px;width:460px;height:400px"></div>

  <!-- ---------- copy column ---------- -->
  <div class="lg" data-logo="dark" style="--h:62px;position:absolute;left:62px;top:52px"></div>

  <div class="abs" style="left:62px;top:168px">
    <div class="d d2">SMART TECH</div>
    <div class="d d2 lime" style="margin-top:6px">BETTER LIFE</div>
    <div class="pipe" style="margin-top:20px;font-size:18px">
      Premium Gadgets<span>|</span>Best Quality<span>|</span>Best Price
    </div>
  </div>

  <div class="trust tight abs" style="left:62px;top:388px">
    <div class="t"><span class="ico-slot" data-i="check"></span>
      <div><b>100%</b><span>Original</span></div></div>
    <div class="t"><span class="ico-slot" data-i="shield"></span>
      <div><b>1 Year</b><span>Warranty</span></div></div>
    <div class="t"><span class="ico-slot" data-i="truck"></span>
      <div><b>Fast</b><span>Delivery</span></div></div>
  </div>

  <div class="cta abs" style="left:62px;top:482px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Shop Now <span class="knob"><i class="chev"></i></span>
  </div>

  <!-- ---------- product field ----------
       Cluster is boxed into x 545–965 so it clears the offer column at 975.
       The three stages share a bottom edge, so the products stand on one
       floor line and read as a single shot. -->
  <div class="stage" style="left:545px;bottom:78px;width:145px;height:225px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>
  <div class="stage" style="left:650px;bottom:52px;width:240px;height:340px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="left:790px;bottom:62px;width:172px;height:200px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>

  <!-- ---------- offer furniture ---------- -->
  <div class="deal abs" style="right:44px;top:70px;width:186px;padding:18px 20px 26px">
    <div class="l1" style="font-size:40px">BEST</div>
    <div class="l2" style="font-size:30px">DEALS</div>
    <div class="band" style="font-size:19px">EVERY DAY</div>
  </div>

  <div class="off abs white" style="right:44px;top:296px;width:186px">
    <div class="up" style="font-size:21px">Up To</div>
    <div class="pct lime-hi" style="font-size:84px">30%</div>
    <div class="lbl">OFF</div>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
