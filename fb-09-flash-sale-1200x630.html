<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>09 · 24 Hour Flash Sale · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     09 — Feed post 1200×630. Urgency layout: the countdown is the loudest
     element after the offer, so the post still works if the copy is skimmed.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-teal"></div>
  <div class="glow" style="left:120px;top:120px;width:520px;height:420px;opacity:.6"></div>

  <!-- lime blade cutting the canvas on the house angle -->
  <div class="pan pan-lime" style="left:640px;right:0;clip-path:polygon(150px 0,190px 0,40px 100%,0 100%)"></div>

  <div class="lg" data-logo="light" style="--h:56px;position:absolute;left:58px;top:50px"></div>

  <div class="row abs" style="left:58px;top:160px;gap:14px">
    <span class="ico-slot" data-i="bolt" style="display:block;width:30px;height:30px"></span>
    <span class="eyebrow on-dark" style="font-size:16px">24 Hours Only</span>
  </div>

  <div class="abs" style="left:58px;top:206px;width:560px">
    <div class="d white" style="font-size:82px;line-height:.94">FLASH</div>
    <div class="d lime-hi" style="font-size:82px;line-height:.94">SALE</div>
  </div>

  <div class="row abs" style="left:58px;top:388px;gap:14px">
    <div class="clk"><b>08</b><i>HRS</i></div>
    <div class="clk"><b>45</b><i>MIN</i></div>
    <div class="clk"><b>12</b><i>SEC</i></div>
  </div>

  <div class="cta abs" style="left:58px;bottom:56px;font-size:19px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Grab The Deal <span class="knob"><i class="chev"></i></span>
  </div>

  <!-- offer + product -->
  <div class="off abs white" style="right:74px;top:96px;width:230px">
    <div class="up" style="font-size:20px">Up To</div>
    <div class="pct lime-hi" style="font-size:104px">30%</div>
    <div class="lbl">OFF</div>
  </div>

  <div class="stage" style="right:210px;bottom:56px;width:210px;height:296px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="right:96px;bottom:64px;width:130px;height:200px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<style>
  /* countdown block */
  .clk { width: 96px; padding: 12px 0 10px; text-align: center; border-radius: 10px;
         background: rgba(255,255,255,.09); border: 1.5px solid var(--line-dark); }
  .clk b { display: block; font-size: 40px; font-weight: 900; color: #fff; letter-spacing: -.03em; line-height: 1; }
  .clk i { display: block; margin-top: 5px; font-style: normal; font-size: 12px; font-weight: 700;
           letter-spacing: .22em; color: rgba(255,255,255,.62); }
</style>

<script src="assets.js"></script>
</body>
</html>
