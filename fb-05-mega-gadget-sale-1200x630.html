<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 · Mega Gadget Sale · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     05 — Feed post 1200×630. Full-teal sale canvas: the offer is the hero,
     the product line-up runs along the floor beneath it.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-teal"></div>
  <div class="dots" style="left:0;top:0;width:260px;height:200px;color:#8FD00E;opacity:.22"></div>
  <div class="dots" style="right:0;bottom:0;width:260px;height:200px;color:#8FD00E;opacity:.22"></div>
  <div class="glow" style="left:50%;top:150px;width:760px;height:420px;transform:translateX(-50%);opacity:.75"></div>

  <!-- lime chevron sweeping across the foot -->
  <div class="pan pan-lime" style="left:-60px;right:-60px;top:auto;bottom:0;height:26px;
       clip-path:polygon(0 0,100% 26px,100% 100%,0 100%)"></div>

  <div class="lg" data-logo="light" style="--h:58px;position:absolute;left:50%;top:46px;transform:translateX(-50%)"></div>

  <div class="abs" style="left:0;right:0;top:136px;text-align:center">
    <div class="eyebrow on-dark">Techcartbd Presents</div>
    <div class="d d1 white" style="margin-top:14px;font-size:96px">MEGA GADGET</div>
    <div class="d d1 lime-hi" style="margin-top:2px;font-size:96px">SALE</div>
  </div>

  <!-- The products are pushed to the outer thirds so the centre channel
       (x 350–850) stays clear for the offer, the CTA and the chips. -->
  <div class="stage" style="left:64px;bottom:40px;width:112px;height:174px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>
  <div class="stage" style="left:172px;bottom:26px;width:172px;height:242px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="left:856px;bottom:34px;width:150px;height:172px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>
  <div class="stage" style="left:986px;bottom:38px;width:154px;height:170px">
    <div class="floor"></div><div class="pslot" data-p="headphone"></div>
  </div>

  <div class="flag abs" style="left:50%;top:380px;transform:translateX(-50%)"><span>Up To 30% Off</span></div>

  <div class="cta abs" style="left:50%;top:474px;transform:translateX(-50%);font-size:19px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Shop Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="row abs mid" style="bottom:44px;gap:14px">
    <div class="chip on-dark"><i class="dot"></i>Free Delivery</div>
    <div class="chip on-dark"><i class="dot"></i>Cash On Delivery</div>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
