<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TECHCARTBD — Page Cover 1640x624</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Facebook crops a cover differently on desktop and mobile. Everything that
     must survive both is kept inside the central 1140px column below.
     Flip .safe to display:block to see the guide while editing. */
  .safe { display: none; position: absolute; z-index: 20; top: 0; bottom: 0;
          left: 250px; width: 1140px; border: 2px dashed rgba(143,208,14,.6); }

  .core { position: absolute; left: 250px; width: 1140px; top: 74px; text-align: center; }

  .usp-row-c { margin-top: 44px; padding: 0 40px; }

  /* decorative product forms, outside the safe column on purpose */
  .deco { position: absolute; z-index: 2; opacity: .5; }
  .deco-l { left: -30px; bottom: -40px; }
  .deco-r { right: -20px; bottom: -56px; }

  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; z-index: 1;
          background: linear-gradient(to top, rgba(2,10,11,.85), transparent); }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; z-index: 4; background: var(--ramp); }
</style>
</head>
<body>

<div class="banner s-cover">
  <div class="atmos"></div>

  <!-- decorative products (may be cropped on mobile - nothing critical here) -->

    <svg viewBox="0 0 440 400" width="380" aria-hidden="true">

      <!-- headband -->
      <path d="M60 250V190a160 160 0 0 1 320 0v60" fill="none" stroke="#2A4341" stroke-width="34" stroke-linecap="round"/>
      <path d="M60 250V190a160 160 0 0 1 320 0v60" fill="none" stroke="rgba(243,248,238,.14)" stroke-width="12" stroke-linecap="round"/>

      <rect x="332" y="228" width="94" height="146" rx="44" fill="url(#h-cup)"/>
      <rect x="30"  y="246" width="62" height="110" rx="31" fill="#16292B"/>
      <rect x="348" y="246" width="62" height="110" rx="31" fill="#16292B"/>
      <circle cx="61"  cy="301" r="15" fill="#8FD00E" opacity=".55"/>
      <circle cx="379" cy="301" r="15" fill="#8FD00E" opacity=".55"/>
    </svg>
  </div>

  <div class="deco deco-r">
    <svg viewBox="0 0 420 480" width="330" aria-hidden="true">

        <linearGradient id="f-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E4EDE8"/><stop offset=".55" stop-color="#A5B6B2"/><stop offset="1" stop-color="#667774"/>

      </defs>
      <!-- stand -->
      <ellipse cx="210" cy="452" rx="104" ry="22" fill="#28403E"/>
      <rect x="196" y="316" width="28" height="132" fill="#33504D"/>
      <!-- guard -->
      <circle cx="210" cy="196" r="164" fill="none" stroke="#2E4A48" stroke-width="16"/>
      <circle cx="210" cy="196" r="130" fill="none" stroke="rgba(243,248,238,.16)" stroke-width="5"/>
      <circle cx="210" cy="196" r="96"  fill="none" stroke="rgba(243,248,238,.16)" stroke-width="5"/>
      <circle cx="210" cy="196" r="62"  fill="none" stroke="rgba(243,248,238,.16)" stroke-width="5"/>
      <!-- blades -->
      <g fill="url(#f-body)" opacity=".92">
        <path d="M210 196c0-64 22-108 62-124 16 44 6 92-28 124z"/>
        <path d="M210 196c56 32 78 76 70 118-46-6-84-36-98-82z" />

      <circle cx="210" cy="196" r="16" fill="#8FD00E" opacity=".5"/>

  <div class="band"></div>

      <text x="85" y="57.5" font-size="11.4" font-weight="500" letter-spacing=".15" fill="#8FA8A3" textLength="83.5" lengthAdjust="spacing">techcartbd.com</text>

    <h1 class="display" style="font-size:56px; margin-top:30px">

    <div class="usp-row usp-row-c">

        <svg class="ico" viewBox="0 0 64 64"><path d="M12 20h30v24H12z"/><path d="M42 28h8l6 8v8h-14"/><path d="M20 52a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/><path d="M8 30h14M4 38h18"/></svg>

    </div>
  </div>

  <div class="safe"></div>
  <div class="rule"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>
