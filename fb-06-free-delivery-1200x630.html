<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>06 · Free Delivery Nationwide · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     06 — Feed post 1200×630. Single-promise banner: delivery. Pale canvas so
     it reads as service information rather than another discount shout.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-pale"></div>
  <div class="pan pan-lime" style="left:520px;right:0;clip-path:polygon(132px 0,100% 0,100% 100%,0 100%)"></div>
  <div class="pan pan-teal" style="left:544px;right:0;clip-path:polygon(132px 0,100% 0,100% 100%,0 100%)"></div>
  <div class="glow" style="right:60px;bottom:40px;width:460px;height:400px"></div>

  <div class="lg" data-logo="dark" style="--h:60px;position:absolute;left:58px;top:52px"></div>

  <div class="abs" style="left:58px;top:178px;width:470px">
    <div class="eyebrow">Anywhere in Bangladesh</div>
    <div class="d d2" style="margin-top:16px;font-size:64px">FREE</div>
    <div class="d d2 lime" style="margin-top:2px;font-size:64px">DELIVERY</div>
    <div class="lede" style="margin-top:20px;font-size:18px">
      On every order over <b style="color:var(--navy)">৳2,000</b>.<br>
      Dhaka in 24 hours, nationwide in 48.
    </div>
  </div>

  <div class="trust abs" style="left:58px;bottom:58px;gap:0">
    <div class="t stack" style="padding-right:28px"><span class="ico-slot" data-i="cash"></span>
      <div><b>Cash On</b><span>Delivery</span></div></div>
    <div class="t stack" style="padding:0 28px"><span class="ico-slot" data-i="ret"></span>
      <div><b>7 Day</b><span>Easy Return</span></div></div>
    <div class="t stack" style="padding-left:28px"><span class="ico-slot" data-i="headset"></span>
      <div><b>Support</b><span>10am – 10pm</span></div></div>
  </div>

  <!-- oversized delivery mark on the teal side -->
  <svg class="abs" viewBox="0 0 24 24" style="right:250px;top:150px;width:220px;height:220px;
       fill:none;stroke:#8FD00E;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.9">
    <path d="M2.6 6.4h10.2v9.1H2.6z"/><path d="M12.8 9.4h3.9l2.9 3v3.1h-6.8z"/>
    <circle cx="6.4" cy="17.6" r="1.9"/><circle cx="15.9" cy="17.6" r="1.9"/>
  </svg>

  <div class="abs white" style="right:66px;top:398px;text-align:right;width:400px">
    <div class="d d5" style="font-size:30px">FAST • SAFE • TRACKED</div>
  </div>

  <div class="cta cta-w abs" style="right:66px;bottom:66px;font-size:19px">
    Order Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>

</html>
