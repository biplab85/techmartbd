<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>11 · Smart Watch Spotlight · 1080×1080</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     11 — Square 1080×1080. Single-product template: teal stage on top with
     an angled hem, white selling block underneath. Reused by 12–15.
     ========================================================================= -->
<div class="b s-sq">

  <div class="field-pale"></div>

  <!-- teal stage, lime hem on the house angle -->
  <div class="abs" style="left:0;right:0;top:0;height:640px;background:var(--ramp-lime);z-index:1;
       clip-path:polygon(0 0,100% 0,100% calc(100% - 76px),0 100%)"></div>
  <div class="abs" style="left:0;right:0;top:0;height:618px;background:var(--ramp-teal);z-index:1;
       clip-path:polygon(0 0,100% 0,100% calc(100% - 76px),0 100%)"></div>

  <div class="dots" style="right:0;top:0;width:260px;height:210px;color:#8FD00E;opacity:.22"></div>
  <div class="glow" style="left:50%;top:130px;width:600px;height:520px;transform:translateX(-50%);opacity:.9"></div>

  <div class="lg" data-logo="light" style="--h:60px;position:absolute;left:64px;top:56px"></div>

  <div class="flag abs" style="right:56px;top:64px"><span>New Arrival</span></div>

  <div class="stage" style="left:50%;top:130px;width:400px;height:530px;transform:translateX(-50%)">
    <div class="pslot" data-p="watch"></div>
  </div>

  <!-- ---------- selling block ---------- -->
  <div class="abs" style="left:0;right:0;top:706px;text-align:center">
    <div class="eyebrow">Smart Watch Series 9</div>
    <div class="d" style="margin-top:16px;font-size:66px;line-height:.96">TRACK EVERY</div>
    <div class="d lime" style="margin-top:2px;font-size:66px;line-height:.96">HEARTBEAT</div>
  </div>

  <div class="row abs mid" style="top:882px;gap:12px">
    <div class="chip"><i class="dot"></i>Bluetooth Call</div>
    <div class="chip"><i class="dot"></i>SpO₂ + BP</div>
    <div class="chip"><i class="dot"></i>IP68</div>
  </div>

  <div class="row abs" style="left:64px;bottom:56px;gap:16px;align-items:baseline">
    <span class="price-was" style="color:#9AAAAF;font-size:26px">৳3,500</span>
    <span class="price-now" style="color:var(--lime-lo);font-size:56px">৳2,450</span>
  </div>

  <div class="cta abs" style="right:64px;bottom:56px;font-size:19px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Order Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
