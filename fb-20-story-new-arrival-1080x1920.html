<div class="b s-story">

  <div class="field-pale"></div>

  <!-- teal foot with an angled hem -->

       clip-path:polygon(0 104px,100% 0,100% 100%,0 100%)"></div>

  <div class="glow" style="left:50%;top:520px;width:700px;height:640px;transform:translateX(-50%);opacity:.5"></div>

  <div class="lg" data-logo="dark" style="--h:74px;position:absolute;left:50%;top:262px;transform:translateX(-50%)"></div>

    <div class="d" style="margin-top:20px;font-size:76px;line-height:.96">SMART WATCH</div>

      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
