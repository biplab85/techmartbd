<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>15 · Audio Spotlight · 1080×1080</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     15 — Square 1080×1080. Audio category post: headphones plus the phone
     and buds, so it reads as a range rather than one SKU.
     ========================================================================= -->
<div class="b s-sq">

  <div class="field-teal"></div>
  <div class="glow" style="left:50%;top:250px;width:720px;height:520px;transform:translateX(-50%);opacity:.75"></div>

  <!-- lime blade across the upper third -->
  <div class="abs" style="left:-60px;right:-60px;top:352px;height:22px;background:var(--ramp-lime);
       z-index:1;clip-path:polygon(0 0,100% 14px,100% 100%,0 calc(100% - 14px))"></div>

  <div class="lg" data-logo="light" style="--h:60px;position:absolute;left:64px;top:58px"></div>

  <div class="abs" style="left:64px;top:158px;width:620px">
    <div class="eyebrow on-dark">Audio Collection</div>
    <div class="d white" style="margin-top:14px;font-size:64px;line-height:.96">HEAR EVERY</div>
    <div class="d lime-hi" style="margin-top:2px;font-size:64px;line-height:.96">DETAIL</div>
  </div>

  <div class="stage" style="left:78px;top:400px;width:420px;height:380px">
    <div class="floor"></div><div class="pslot" data-p="headphone"></div>
  </div>
  <div class="stage" style="right:86px;top:392px;width:330px;height:400px">
    <div class="floor"></div><div class="pslot" data-p="phone"></div>
  </div>

  <div class="row abs mid" style="top:816px;gap:12px">
    <div class="chip on-dark"><i class="dot"></i>Deep Bass</div>
    <div class="chip on-dark"><i class="dot"></i>40 Hour Playtime</div>
    <div class="chip on-dark"><i class="dot"></i>Bluetooth 5.3</div>
  </div>

  <hr class="hair on-dark abs" style="left:64px;right:64px;top:894px">

  <div class="trust abs" style="left:64px;bottom:56px;gap:30px">
    <div class="t on-dark"><span class="ico-slot" data-i="check"></span><div><b>100% Original</b></div></div>
    <div class="t on-dark"><span class="ico-slot" data-i="truck"></span><div><b>Fast Delivery</b></div></div>
  </div>

  <div class="cta abs" style="right:64px;bottom:56px;font-size:19px">
    Shop Audio <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
