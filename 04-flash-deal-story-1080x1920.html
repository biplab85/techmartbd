<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TECHCARTBD — Flash Deal Story 1080x1920</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* Story UI sits over the top ~250px and bottom ~250px. Nothing important there. */
  .safe { display: none; position: absolute; z-index: 20; left: 0; right: 0;
          top: 250px; bottom: 250px; border: 2px dashed rgba(143,208,14,.55); }

  .head   { position: absolute; left: 80px; right: 80px; top: 268px; text-align: center; }
  .stage-4{ left: 50%; transform: translateX(-50%); top: 700px; width: 780px; height: 620px; z-index: 3; }
  .ped-4  { left: 300px; top: 1268px; width: 480px; height: 130px; }
  .foot4  { position: absolute; left: 80px; right: 80px; bottom: 280px; text-align: center; }

  .swipe  { position: absolute; left: 0; right: 0; bottom: 176px; text-align: center; z-index: 4; }
  .swipe .arrow { display: block; width: 22px; height: 22px; margin: 0 auto 14px;
    border-left: 4px solid var(--lime-hi); border-top: 4px solid var(--lime-hi);
    transform: rotate(45deg); }

  .band4 { position: absolute; inset: 0; z-index: 1; background: var(--ramp); opacity: .16;
           clip-path: polygon(0px 620px, 1080px 620px, 1080px 1240px, 0px 1240px); }
</style>
</head>
<body>

<div class="banner s-story">
  <div class="atmos"></div>
  <div class="pedestal ped-4"></div>

  <!-- ===================== HEAD ===================== -->
  <div class="head">
    <svg class="logo" viewBox="0 0 236 72" role="img" aria-label="TechCartBD" style="height:76px; margin:0 auto">
      <defs>
        <linearGradient id="Lbar" gradientUnits="userSpaceOnUse" x1="11" y1="21" x2="46.9" y2="15">
          <stop offset="0" stop-color="#17924E"/><stop offset=".5" stop-color="#5FA028"/><stop offset="1" stop-color="#86BD08"/></linearGradient>
        <linearGradient id="Lstem" gradientUnits="userSpaceOnUse" x1="26.5" y1="24" x2="26.5" y2="58.8">
          <stop offset="0" stop-color="#0A9364"/><stop offset="1" stop-color="#047285"/></linearGradient>
        <linearGradient id="Larm" gradientUnits="userSpaceOnUse" x1="56" y1="13.4" x2="56" y2="24">
          <stop offset="0" stop-color="#12A165"/><stop offset="1" stop-color="#0E9159"/></linearGradient>
        <linearGradient id="Lhook" gradientUnits="userSpaceOnUse" x1="38" y1="25.2" x2="70.8" y2="58.8">
          <stop offset="0" stop-color="#8CC80B"/><stop offset=".37" stop-color="#329B49"/><stop offset="1" stop-color="#027183"/></linearGradient>
      </defs>
      <path fill="url(#Lbar)"  d="M11 13.4H46.86L38.61 24H11Z"/>
      <path fill="url(#Lstem)" d="M21 24h11v34.8H21z"/>
      <path fill="url(#Larm)"  d="M49.86 13.4H71.86L63.61 24H41.61Z"/>
      <path fill="url(#Lhook)" d="M38 25.2H48.5V44.7A3.6 3.6 0 0 0 52.1 48.3H70.8L63.8 58.8H52.1A14.1 14.1 0 0 1 38 44.7Z"/>
      <text x="84" y="39.5" font-size="21.4" font-weight="700" letter-spacing="-.3" textLength="129.5" lengthAdjust="spacing">
        <tspan fill="#F3F8EE">TECH</tspan><tspan fill="#8FD00E">CART</tspan><tspan fill="#F3F8EE">BD</tspan></text>
      <text x="85" y="57.5" font-size="11.4" font-weight="500" letter-spacing=".15" fill="#8FA8A3" textLength="83.5" lengthAdjust="spacing">techcartbd.com</text>
    </svg>

    <div style="margin-top:56px">
      <span class="flag"><span class="flag-txt">Today Only</span></span>
    </div>

    <h1 class="display" style="font-size:128px; margin-top:46px">Flash<br><span class="on-grad">Deal</span></h1>
  </div>

  <div class="band4"></div>

  <!-- ===================== PRODUCT ===================== -->
  <div class="stage stage-4">
    <div class="halo"></div>
    <div class="product-slot is-placeholder">
      <!-- SWAP -> <img src="photos/blender.png" alt="Juicer blender"> -->
      <svg viewBox="0 0 480 760" width="470" aria-label="Juicer blender">
        <defs>
          <linearGradient id="b-base" x1="0" y1="0" x2="1" y2=".4">
            <stop offset="0" stop-color="#E7EFEA"/><stop offset=".42" stop-color="#AEBEBA"/>
            <stop offset="1" stop-color="#5F706D"/>
          </linearGradient>
          <linearGradient id="b-glass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="rgba(255,255,255,.42)"/>
            <stop offset=".22" stop-color="rgba(255,255,255,.10)"/>
            <stop offset=".78" stop-color="rgba(255,255,255,.08)"/>
            <stop offset="1"   stop-color="rgba(255,255,255,.34)"/>
          </linearGradient>
          <linearGradient id="b-juice" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#A8DC16"/><stop offset=".5" stop-color="#7AB80C"/>
            <stop offset="1" stop-color="#4E8A18"/>
          </linearGradient>
        </defs>

        <!-- lid -->
        <rect x="128" y="44" width="216" height="40" rx="18" fill="url(#b-base)"/>
        <ellipse cx="236" cy="44" rx="42" ry="17" fill="#B9C8C4"/>
        <ellipse cx="236" cy="38" rx="26" ry="11" fill="#7E8F8C"/>

        <!-- jar contents -->
        <path d="M147 88h178l-20 300H167z" fill="rgba(255,255,255,.05)"/>
        <path d="M158 208h156l-13 180H171z" fill="url(#b-juice)"/>
        <ellipse cx="236" cy="208" rx="78" ry="13" fill="#B8E83C"/>
        <!-- jar glass + spout -->
        <path d="M147 88h178l-20 300H167z" fill="url(#b-glass)"/>
        <path d="M147 88h178l-20 300H167z" fill="none" stroke="rgba(243,248,238,.55)" stroke-width="5"/>
        <path d="M325 88l24-14 6 18-26 12z" fill="rgba(243,248,238,.42)"/>
        <!-- handle -->
        <path d="M325 132c46 6 62 34 62 66s-18 56-58 62" fill="none" stroke="#33504D" stroke-width="24" stroke-linecap="round"/>
        <!-- measure marks -->
        <g stroke="rgba(243,248,238,.42)" stroke-width="4" stroke-linecap="round">
          <path d="M170 160h30"/><path d="M166 210h22"/><path d="M162 260h30"/><path d="M158 310h22"/>
        </g>

        <!-- base -->
        <path d="M167 388h138l26 168H141z" fill="url(#b-base)"/>
        <rect x="132" y="546" width="216" height="34" rx="14" fill="#3B5451"/>
        <ellipse cx="240" cy="592" rx="128" ry="20" fill="#22393A"/>
        <!-- dial + panel -->
        <circle cx="240" cy="470" r="40" fill="#2B4443"/>
        <circle cx="240" cy="470" r="27" fill="#43605C"/>
        <rect x="236" y="446" width="8" height="20" rx="4" fill="#8FD00E"/>
        <rect x="176" y="512" width="128" height="10" rx="5" fill="rgba(0,0,0,.25)"/>
        <circle cx="196" cy="470" r="8" fill="#8FD00E" opacity=".85"/>
        <circle cx="284" cy="470" r="8" fill="rgba(243,248,238,.25)"/>
      </svg>
    </div>
  </div>

  <!-- ===================== OFFER ===================== -->
  <div class="foot4">
    <h2 class="display d-3">2-in-1 Juicer Blender</h2>
    <div class="micro" style="margin-top:18px">400W &middot; Stainless Blades &middot; 1.5L Jar</div>

    <div class="price" style="justify-content:center; margin-top:34px">
      <span class="price-now" style="font-size:96px"><span class="tk">&#2547;</span>2,450</span>
      <span class="price-was" style="font-size:42px"><span class="tk">&#2547;</span>3,950</span>
    </div>

    <div style="margin-top:40px">
      <span class="cta" style="font-size:26px; padding:26px 52px">Order on Messenger <i class="chev"></i></span>
    </div>
  </div>

  <div class="swipe">
    <i class="arrow"></i>
    <span class="micro">Swipe up &middot; Cash on delivery</span>
  </div>

  <div class="safe"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
</div>

</body>
</html>
