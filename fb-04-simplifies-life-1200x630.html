<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 · Tech That Simplifies Life · 1200×630</title>
<link rel="stylesheet" href="fb.css">
</head>
<body>

<!-- =========================================================================
     04 — Feed post 1200×630. Reference row 3, mirrored to portrait-friendly
     proportions: teal statement block left, product field centre, white
     brand-and-trust block right, hexagon seal straddling the seam.
     ========================================================================= -->
<div class="b s-feed">

  <div class="field-pale"></div>

  <!-- teal statement block, lime seam on its trailing edge -->
  <div class="pan pan-lime" style="left:0;width:474px;clip-path:polygon(0 0,100% 0,calc(100% - 84px) 100%,0 100%)"></div>
  <div class="pan pan-teal" style="left:0;width:452px;clip-path:polygon(0 0,100% 0,calc(100% - 84px) 100%,0 100%)"></div>

  <div class="glow" style="left:470px;bottom:30px;width:420px;height:380px;opacity:.5"></div>
  <div class="dots" style="left:0;top:0;width:180px;height:150px;color:#8FD00E;opacity:.20"></div>

  <!-- ---------- statement ---------- -->
  <div class="abs" style="left:56px;top:180px;width:340px">
    <div class="d d4 white">TECH THAT</div>
    <div class="d d4 lime-hi" style="margin-top:4px">SIMPLIFIES LIFE</div>
    <hr class="rule-lime" style="margin:24px 0 20px">
    <div class="lede on-dark" style="font-size:17px">
      From your home to your hands,<br>we bring the best gadgets for you.
    </div>
  </div>

  <!-- ---------- product field ---------- -->
  <div class="stage" style="left:420px;bottom:150px;width:172px;height:246px">
    <div class="floor"></div><div class="pslot" data-p="blender"></div>
  </div>
  <div class="stage" style="left:534px;bottom:168px;width:106px;height:164px">
    <div class="floor"></div><div class="pslot" data-p="watch"></div>
  </div>
  <div class="stage" style="left:588px;bottom:158px;width:132px;height:154px">
    <div class="floor"></div><div class="pslot" data-p="cooker"></div>
  </div>

  <!-- Hexagon seal sits above the product field, not beside it: at 1200 wide
       there is no horizontal room between the products and the trust column. -->
  <div class="seal abs" style="left:600px;top:96px;width:178px;height:178px">
    <div>
      <div class="up">Up To</div>
      <div class="pct" style="font-size:60px">30%</div>
      <div class="lbl" style="font-size:21px">OFF</div>
    </div>
  </div>

  <!-- ---------- brand + trust block ---------- -->
  <div class="lg" data-logo="dark" style="--h:58px;position:absolute;right:56px;top:88px"></div>

  <div class="trust abs" style="right:56px;top:222px;gap:0">
    <div class="t stack" style="padding-right:18px"><span class="ico-slot" data-i="check"></span>
      <div><b>100%</b><span>Original</span></div></div>
    <div class="t stack" style="padding:0 18px"><span class="ico-slot" data-i="shield"></span>
      <div><b>1 Year</b><span>Warranty</span></div></div>
    <div class="t stack" style="padding-left:18px"><span class="ico-slot" data-i="ret"></span>
      <div><b>Easy</b><span>Return</span></div></div>
  </div>

  <div class="cta abs" style="right:56px;top:376px;font-size:18px">
    <svg class="cart" viewBox="0 0 24 24"><path d="M2.5 3.5h3l2.4 11.2h9.8l2.2-8.1H7"/>
      <circle cx="10" cy="19.4" r="1.6"/><circle cx="17.6" cy="19.4" r="1.6"/></svg>
    Shop Now <span class="knob"><i class="chev"></i></span>
  </div>

  <div class="vig"></div><div class="grain"></div>
</div>

<script src="assets.js"></script>
</body>
</html>
